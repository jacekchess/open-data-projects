# Position taxonomy and role-specific metric configuration.
# Metric names must match the columns in the processed player CSV
# (per-90 and *_percentile variants are derived from these base names).
# These are statistical indicators, not a complete measure of tactical role suitability.

# Importance tiers used inside every role's `metrics` block:
#   high    - clearly important for the role. Scored.
#   low     - nice to have for a player in the role, but not crucial in every tactic. Scored.
#   support - role "feature" metrics (set pieces, penalties, 1v1s, headers, discipline...).
#             Displayed only. Never contributes to the score.
# Every high/low metric below has a *_percentile column, so it can be scored directly.
# Support metrics may lack one (they are displayed, not ranked).
importance_tiers:
  high:    {weight: 2.0, scored: true}
  low:     {weight: 1.0, scored: true}
  support: {weight: 0.0, scored: false}


position_groups:
  Goalkeeper:
    positions: ["Goalkeeper"]
    roles: ["Goalkeeper", "Sweeper Keeper", "Ball-Playing Goalkeeper"]

  Centre Back:
    positions: ["Center Back", "Left Center Back", "Right Center Back"]
    roles: ["Central Defender", "No-Nonsense Centre-Back", "Ball-Playing Defender", "Wide Centre-Back", "Libero"]

  Full Back:
    positions: ["Left Back", "Right Back"]
    roles: ["Full-Back", "Inverted Full-Back", "No-Nonsense Full-Back", "Inverted Wing-Back"]

  Wing Back:
    positions: ["Left Wing Back", "Right Wing Back"]
    roles: ["Wing-Back", "Complete Wing-Back", "Inverted Wing-Back", "Playmaking Wing-Back"]

  Defensive Midfield:
    positions: ["Center Defensive Midfield", "Left Defensive Midfield", "Right Defensive Midfield"]
    roles: ["Defensive Midfielder", "Anchor", "Half-Back", "Ball-Winning Midfielder", "Deep-Lying Playmaker", "Segundo Volante"]

  Central Midfield:
    positions: ["Right Center Midfield", "Left Center Midfield"]
    roles: ["Central Midfielder", "Box-to-Box Midfielder", "Deep-Lying Playmaker", "Roaming Playmaker", "Mezzala", "Carrilero", "Ball-Winning Midfielder"]

  Attacking Midfield:
    positions: ["Center Attacking Midfield"]
    roles: ["Attacking Midfielder", "Advanced Playmaker", "Enganche", "Trequartista", "Shadow Striker"]

  Wide Midfield:
    positions: ["Left Midfield", "Right Midfield"]
    roles: ["Wide Midfielder", "Wide Playmaker", "Wide Midfielder (Defensive)", "Wide Midfielder (Attacking)"]

  Winger:
    positions: ["Left Wing", "Right Wing", "Right Attacking Midfield"]
    roles: ["Winger", "Inverted Winger", "Inside Forward", "Wide Playmaker", "Raumdeuter"]

  Centre Forward:
    positions: ["Center Forward", "Left Center Forward", "Right Center Forward"]
    roles: ["Advanced Forward", "Complete Forward", "Deep-Lying Forward", "False Nine", "Target Forward", "Poacher", "Pressing Forward", "Trequartista", "Second Striker", "Channel Forward"]

# Each role lists its metrics split into high / low / support importance.
# A metric may appear in several roles, but only once per role.
roles:
  # ---------------------------------------------------------------- Goalkeepers
  Goalkeeper:
    metrics:
      high: [goals_prevented, save_pct]
      low: [saves, action_type_collected, action_outcome_fail, pass_completion_pct]
      support: [shots_on_target_faced, xg_against_on_target_shots, goals_conceded, gk_actions, action_type_punch, penalties_faced, penalties_saved, penalty_save_pct, penalty_goals_conceded]

  Sweeper Keeper:
    metrics:
      high: [goals_prevented, action_type_keeper_sweeper, action_type_smother]
      low: [save_pct, action_outcome_fail, gk_actions, action_type_collected, completed_passes, pass_completion_pct, forward_passes]
      support: [shots_on_target_faced, saves, actions_per_shot_on_target, action_type_punch, penalties_faced, penalties_saved, penalty_save_pct]

  Ball-Playing Goalkeeper:
    metrics:
      high: [goals_prevented, pass_completion_pct, forward_passes, line_breaking_passes]
      low: [completed_passes, save_pct, action_type_collected, action_type_keeper_sweeper, action_outcome_fail]
      support: [key_passes, xag, gk_actions, shots_on_target_faced, saves, penalties_faced, penalties_saved, penalty_save_pct]

  # ---------------------------------------------------------------- Centre-backs
  Central Defender:
    metrics:
      high: [interceptions, blocks, clearances, aerial_duel_win_pct, tackle_success_pct, dribbled_past_pct]
      low: [aerial_won, tackles_won, ball_recoveries, pressures, completed_passes, pass_completion_pct, line_breaking_passes, fouls]
      support: [aerial_clearances_won, yellow_cards, red_cards]

  No-Nonsense Centre-Back:
    metrics:
      high: [clearances, blocks, aerial_duel_win_pct, aerial_clearances_won, tackle_success_pct, dribbled_past_pct]
      low: [aerial_won, tackles_won, interceptions, ball_recoveries, pressures]
      support: [fouls, yellow_cards, red_cards]

  Ball-Playing Defender:
    metrics:
      high: [completed_passes, pass_completion_pct, forward_passes, line_breaking_passes]
      low: [interceptions, clearances, aerial_duel_win_pct, dribbled_past_pct, successful_carries, long_carries_10m, key_passes, dispossessed]
      support: [xag, total_carry_distance, aerial_clearances_won]

  Wide Centre-Back:
