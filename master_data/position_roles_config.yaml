      low: [completed_passes, pass_completion_pct, total_carry_distance, completed_dribbles, key_passes, ball_recoveries, clearances, aerial_duel_win_pct, pressures, dispossessed]
      support: [xag, dribble_success_pct, very_long_carries_20m]

  # ---------------------------------------------------------------- Full-backs
