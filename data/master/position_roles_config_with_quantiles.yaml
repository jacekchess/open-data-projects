quantile_metadata:
  quantiles:
    p10: 0.1
    p25: 0.25
    p50: 0.5
    p75: 0.75
    p90: 0.9
  minimum_minutes: 90
  normalization: Count and volume metrics use per-90 values. Percentages and averages are unchanged.
  population: All players in each grouped position. Statistics are not filtered by role.
  percentile_scoring:
    scale: 1-100
    higher_is_better: Higher values receive higher percentiles.
    lower_is_better:
    - action_outcome_fail
    - aerial_lost
    - dispossessed
    - dribbled_past
    - dribbled_past_pct
    - fouls
    - goals_conceded
    - penalty_goals_conceded
    - red_cards
    - tackles_lost
    - yellow_cards
    ranking_population: Players within the same grouped position.
    count_metrics: Ranked using per-90 values.
    rate_metrics: Ranked using original values.
    ties: Players with tied values receive the same percentile.
